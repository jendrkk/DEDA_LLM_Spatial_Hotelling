# Q-learning agent configuration for the Berlin baseline run
# use_batch: vectorized BatchQLearningAgent (default); False uses per-store agents.
# One QLearningAgent per incumbent store when use_batch is false; no CEO in Phase 0.
use_batch: true
#
# Joint action encoding: joint_action_idx = price_idx * m_effort + effort_idx
# State: k nearest neighbors' joint action indices from the previous period.
#
# References: Calvano et al. (2020 AER) Table 1 parameterisation.

# Action space dimensions
# Union grid spans every chain's [Nash, monopoly] (~2x wider than global mean);
# raise m so each chain still gets ~1 EUR resolution within its sub-band.
m: 18             # number of discrete price levels (was 15 under global grid)
# Phase-0 baseline replicates Calvano price-only. Raise m_effort (and recalibrate
# beta_effort/e_max) only for the full effort-extended model.
m_effort: 1       # Calvano validation limit: effort frozen (price-only game)
e_max: 10.0       # maximum effort level (effort_grid = linspace(0, e_max, m_effort))

# State space
state_mode: neighbors      # "neighbors" (k-nearest rival actions, default)
                           # or "local_summary" (discretized local price index)
local_sum_n: null          # local_summary only: null/0 -> demand-overlap set
                           # (stores sharing >=1 catchment cell); N>0 -> N nearest
n_price_bins: 10           # B: bins per price-summary statistic
summary_stats: ["mean"]    # subset of ["mean","min"]; state_size = B^len(stats)
local_summary_detailed: false   # true -> two channels: total local market
                                # + same-chain-type local market (state=B^2)
k_neighbors: 1    # number of nearest-rival joint actions in the Q-table state
                  # State space size = (m * m_effort)^k = 25^1 = 25 for baseline

# Q-learning hyperparameters (Calvano 2020 calibration)
alpha_lr: 0.15         # learning rate α
beta_decay: 0.9e-6     # exploration decay rate β; ε(t) = exp(−β·t); base: 4.0e-6
                       # with T=1M steps: ε(1M) = exp(−4) ≈ 0.018 (mostly exploiting)
delta: 0.95            # discount factor δ
update_mode: async   # AFP (2022) "async": only visited (s,a) cell updated.
                     # Calvano (2020) protocol. NOTE: BatchQLearningAgent
                     # (use_batch=true) ignores this param; it always does
                     # single-cell async update by construction.

# Price grid bounds (relative to marginal cost = 0 baseline, ADR-014)
min_price: 0.0         # lower bound (= marginal cost for mc=0 baseline)
max_price: 2.0         # upper bound; adjust if Bertrand-Nash price falls outside range
auto_price_grid: true    # derive grid from Nash/monopoly benchmarks (Calvano)
price_grid_mode: union   # "union" spans every chain's own [Nash, monopoly]
                         # (correct for the vertically differentiated market);
                         # "global" = legacy single-mean grid (clips discount
                         # floor / bio ceiling — kept only for reproducing old runs)
price_grid_xi: 0.1       # grid margin beyond [p_nash, p_mono]
