# Q-learning agent configuration for the Berlin baseline run
# use_batch: vectorized BatchQLearningAgent (default); False uses per-store agents.
# One QLearningAgent per incumbent store when use_batch is false; no CEO in Phase 0.
use_batch: true
#
# Joint action encoding: joint_action_idx = price_idx * m_effort + effort_idx
# State: k nearest neighbors' joint action indices from the previous period.
#
# References: Calvano et al. (2020 AER) Table 1 parameterisation.

# Action space dimensions
# Union grid spans every chain's [Nash, monopoly] (~2x wider than global mean);
# raise m so each chain still gets ~1 EUR resolution within its sub-band.
m: 18             # number of discrete price levels (was 15 under global grid)
# Phase-0 baseline replicates Calvano price-only. Raise m_effort (and recalibrate
# beta_effort/e_max) only for the full effort-extended model.
m_effort: 1       # Calvano validation limit: effort frozen (price-only game)
e_max: 10.0       # maximum effort level (effort_grid = linspace(0, e_max, m_effort))

# State space
state_mode: neighbors      # "neighbors" (k-nearest rival actions, default)
                           # or "local_summary" (discretized local price index)
local_sum_n: null          # local_summary only: null/0 -> demand-overlap set
                           # (stores sharing >=1 catchment cell); N>0 -> N nearest
n_price_bins: 10           # B: bins per price-summary statistic
summary_stats: ["mean"]    # subset of ["mean","min"]; state_size = B^len(stats)
local_summary_detailed: false   # true -> two channels: total local market
                                # + same-chain-type local market (state=B^2)
k_neighbors: 1    # number of nearest-rival joint actions in the Q-table state
                  # State space size = (m * m_effort)^k = 25^1 = 25 for baseline

# Q-learning hyperparameters (Calvano 2020 calibration)
alpha_lr: 0.15         # learning rate α
beta_decay: 0.9e-6     # single-stage fallback β (used only with --no-auto-beta)
delta: 0.95            # discount factor δ

# ── Two-stage exploration schedule (default when beta_decay_auto: true) ──────
# Adaptive to T_burnin: both β values scale as 1/T, so the normalised shape
# is invariant (β₂/β₁ ≈ 4.7× at defaults, independent of run length).
#
# Stage 1 (t ≤ t₀): ε(t) = max(ε_min, exp(−β₁·t))
# Stage 2 (t > t₀): ε(t) = max(ε_min, ε_transition · exp(−β₂·(t−t₀)))
#
# Calibration (auto-computed in runner.py):
#   β₁ = −ln(ε_transition) / t₀
#   β₂ = ln(ε_transition / ε_min) / (T − t₀)
#
# Continuity:  ε(t₀) = ε_transition  (no jump at the stage switch).
# Collusion support: long stage 1 explores the coordination space; rapid
# stage 2 collapse locks the collusive attractor before deviation can unlearn it.
#
# mean(ε) ≈ f₀·g(ε_transition) + (1−f₀)·h(ε_transition, ε_min)
#   where g(x)=(1−x)/(−ln x),  h(a,b)=(a−b)/ln(a/b)
#   ≈ 0.26 at defaults (comparable to Calvano single-stage ≈ 0.245).
beta_schedule: two_stage  # "two_stage" (default) or "single" (legacy Calvano)
explore_fraction: 0.7     # f₀: t₀ = round(f₀ × T_burnin), 0.65
epsilon_transition: 0.06  # ε(t₀): target exploration rate at the stage switch
epsilon_min: 1.0e-4       # ε floor; also ε(T) target for β₂ calibration [1e-4, 1e-3]
update_mode: async   # AFP (2022) "async": only visited (s,a) cell updated.
                     # Calvano (2020) protocol. NOTE: BatchQLearningAgent
                     # (use_batch=true) ignores this param; it always does
                     # single-cell async update by construction.

# Price grid bounds (relative to marginal cost = 0 baseline, ADR-014)
min_price: 0.0         # lower bound (= marginal cost for mc=0 baseline)
max_price: 2.0         # upper bound; adjust if Bertrand-Nash price falls outside range
auto_price_grid: true    # derive grid from Nash/monopoly benchmarks (Calvano)
price_grid_mode: union   # "union" spans every chain's own [Nash, monopoly]
                         # (correct for the vertically differentiated market);
                         # "global" = legacy single-mean grid (clips discount
                         # floor / bio ceiling — kept only for reproducing old runs)
price_grid_xi: 0.1       # grid margin beyond [p_nash, p_mono]

# ── Hybrid profit-gap state (--hybrid-states) ──────────────────────────────────
# State: (own_price_bin × prev_profit_bin × nearest_rival_gap_bin × 2nd_rival_gap_bin)
# gap formula: (p_own − p_rival) / p_rival  (percentual deviation of own from rival EUR price)
# State size = m × hybrid_n_profit × hybrid_n_gap² = 18×5×81 = 7290 (defaults)
# Profit bins are chain-type-specific; thresholds computed at init from price-grid sweep.
# Action space: m = 18 price actions (unchanged from baseline).
# See: src/hotelling/env/market_env.py  _hybrid_state_signal()
hybrid_n_profit: 5         # profit quantile bins: very_bad / bad / average / good / very_good
                           # bin boundaries at q_0.2 / q_0.4 / q_0.6 / q_0.8 per chain type
hybrid_n_gap: 9            # bins per rival price-gap dimension
                           # default range [-0.20, +0.20] → step ≈ 0.044 per bin
hybrid_gap_lo: -0.20       # lower bound of percentual price-gap range (clamps below → bin 0)
hybrid_gap_hi:  0.20       # upper bound of percentual price-gap range (clamps above → bin 8)

# ── Graph-states reciprocal rival mode  (--graph-states K M B GRID MATCH) ───────
# When --graph-states is active, EVERY key in this section OVERRIDES the matching
# base Q-learning param above; the 5 CLI positionals then override the structural
# knobs (graph_k, m, graph_n_rival_bins, graph_own_grid_type, graph_rival_match).
# Edit learning hyperparameters for graph-states runs HERE, not in the base section.
#
# Rivals form an UNDIRECTED, degree-<=graph_k observation graph (reciprocity is
# structural). Edge weight = symmetric average diversion ratio at Bertrand-Nash:
#   W[a,b] = 1/2 * M[a,b] * (1/E[a] + 1/E[b]),  M[a,b]=Sum_ih w_ih s_ia s_ib.
# The 1/E normalisation up-weights remote/isolated rivalries (where local collusion
# is plausible). State size = m * graph_n_rival_bins ^ graph_k.
graph_states_params:
  # Learning hyperparameters (Calvano 2020 calibration; compatible with two_stage)
  alpha_lr: 0.125
  delta: 0.98
  beta_decay_auto: true
  beta_schedule: two_stage      # overridden by an explicit --beta-schedule flag
  explore_fraction: 0.25
  epsilon_transition: 0.08
  epsilon_min: 1.0e-4
  beta_decay: 0.9e-6            # single-stage fallback (only used with --beta-schedule single)
  # Structural defaults (overridden by the 5 CLI positionals)
  m: 18                         # int_2: action price bins
  m_effort: 1                   # price-only Calvano baseline
  graph_k: 2                    # int_1: rivals per store (max undirected degree)
  graph_n_rival_bins: 12        # int_3: rival price bins in the state
  graph_own_grid_type: "G"      # str_1: "CS" (chain-specific) or "G" (global)
  graph_rival_match: "A"        # str_2: "SC" (same chain type) or "A" (any)
  # Grid + graph construction
  auto_price_grid: true
  price_grid_xi: 0.1
  graph_candidate_topn: 12      # per-store candidate edges considered before b-matching # 8.0
  graph_min_edge_weight: 0.0    # drop candidate edges with diversion weight <= this floor
