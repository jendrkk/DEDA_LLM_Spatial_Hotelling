# agents/chain_ceo.yaml - LLM chain CEO agent parameters (v2: AWS Bedrock Claude Haiku 4.5)
# LiteLLM routes "bedrock/<model>" to AWS Bedrock using boto3 and the standard AWS
# credential chain (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY + AWS_DEFAULT_REGION).
# Cross-region inference profile prefix "us." is required for Haiku 4.5+ on Bedrock
# (bare model IDs are not supported for on-demand invocation of Claude 4.x models).
model: "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"   # set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
ceo_mode: "single"                 # "single" v1; "decomposed" (analyst sub-agents) reserved
temperature: 1                     # deterministic; override via --temp [0.0, 2.0]
                                   # (default 0 = deterministic; 0.3–0.7 recommended for CEO exploration)
max_tokens: 2048                   # room for the full structured envelope JSON
max_retries: 3                 # legacy field (kept for compatibility; retry cadence
                               # is now governed by the backoff settings below)
log_path: "results/llm_calls.jsonl"

# Transient-error resilience. Bedrock is highly reliable; transient errors are rare
# (only ThrottlingException / 429 under load, or occasional 503 during AWS incidents).
# Much tighter timeout than AI Studio — Haiku 4.5 responds in 300–600ms.
timeout: 30.0                  # per-call wall-clock timeout (seconds)
transient_max_attempts: 3      # total attempts per call on transient errors
backoff_base: 1.0              # wait_random_exponential multiplier (seconds)
backoff_max: 15.0              # backoff ceiling (seconds)
save_communication: false      # usually toggled via --save-LLM-con, not here

# Bedrock on-demand: per-token billing, no hard daily cap. Soft quota is ~50 RPM
# by default (requestable increase). Disable the RateLimiter (0 = no limit enforced
# client-side); transient 429s are handled by the tenacity backoff above instead.
requests_per_minute: 0
requests_per_day: 0

# Haiku 4.5 supports extended thinking but we disable it: deterministic pricing
# decisions (temperature=0) need no chain-of-thought, and thinking tokens would
# inflate cost and latency with no benefit for JSON envelope generation.
reasoning_effort: null
force_reasoning_effort: false
instructor_mode: "tools"           # TOOLS mode (function-calling): canonical for Claude;
                                   # more reliable than JSON mode for complex Pydantic schemas

# Claude natively supports a separate system role — no prompt folding needed.
merge_system_prompt: false

# Euro-basket envelope guidance shown to the CEO and used by the safe-default fallback.
min_delta_p: 1.0
min_delta_e: 0.1

group_analytics: false   # baseline 2.0: per-group competitive analytics in the prompt
