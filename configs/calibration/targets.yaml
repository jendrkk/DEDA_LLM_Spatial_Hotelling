# ---------------------------------------------------------------------------
# configs/calibration/targets.yaml
# Empirical calibration targets for the structural parameters.
# Each value is an external moment; sources in comments. The calibration
# scripts read ONLY this file for empirical inputs.
# ---------------------------------------------------------------------------
#
# scale anchor: representative STANDARD-chain basket price, euros per trip.
# Free normalization (model is scale-covariant); set for interpretability.
basket_price_standard_eur: 60.0
#
# Chain-type price-level indices, relative to standard = 1.0.
# Source: German grocery basket price studies (discounter vs full-range;
# organic premium). Transcribe from Statista / Thünen-Institut / BÖLW.
# q_S and q_B are DERIVED from this ladder in compute_qualities() (ADR-028);
# they are not solved parameters.
price_index:
  discount: 0.90
  standard: 1.00
  bio:      1.35
#
# Gross margin = (price - COGS) / price, per chain type.
# Baseline uses ONE common margin (parsimonious). Chain-specific values
# are provided for the sensitivity run. Source: EHI Handel aktuell;
# REWE Group / Ahold Delhaize annual reports.
gross_margin_common: 0.22
gross_margin_by_chain:
  discount: 0.23 #0.18
  standard: 0.22 #0.24
  bio:      0.34 #0.30
use_common_margin: false        # true -> baseline; false -> chain-specific
#
# Value of travel time.
# wage_monthly_gross_eur: Berlin median gross monthly wage of full-time
#   employees. Source: Amt für Statistik Berlin-Brandenburg / the PLR median
#   income file (Medianeinkommen_Berlin-2023.xlsx, Berlin-wide median).
# work_hours_per_month: 4.33 weeks * weekly full-time hours.
# vtt_wage_ratio (theta): fraction of the gross wage used as value of travel
#   time for personal/shopping trips. Source: Wardman et al. (2016) European
#   VTT meta-analysis; German BVWP 2030 methodology. Typical 0.35-0.50.
# round_trip_factor: 2.0 because travel_times are ONE-WAY and a shopping
#   occasion is a round trip. Set to 1.0 only if travel_times become round-trip.
wage_monthly_gross_eur: 3955.0
work_hours_per_month: 167.0
vtt_wage_ratio: 0.5
round_trip_factor: 2.0
#
# Outside-option target: aggregate share of consumer mass choosing NO
# inner-ring store (online delivery + out-of-area + non-purchase).
# Source: German online-grocery share is 5-10% nationally (ECDB 2025), but
# inner-Berlin physical density is very high and most online food spend is
# non-perishable; the substitution-away share for routine grocery trips in
# inner Berlin is lower. Default 0.04; document range 0.02-0.06.
outside_share_target: 0.04
#
# Exogenous consumer-type quality-sensitivity ratio alpha_H / alpha_L.
# NOT solved: set directly from the organic-consumption income gradient in
# the German literature (NVS II, EsKiMo II social gradient; BMEL
# Ökobarometer) — high-SES households consume roughly 2-3x more organic.
# The model's realised bio income gradient is reported as a VALIDATION
# output, not a calibration target. Default 2.3; document range 2.0-3.0.
alpha_ratio: 2.3
#
# Reference for validation report only (NOT a solve target).
# Definition: ratio of bio inside-share among HIGH-pi_H cells (top quartile of
# pi_H) to bio inside-share among LOW-pi_H cells (bottom quartile of pi_H).
# Source: organic consumption rises strongly with SES/income — German NVS II
# and EsKiMo II social-gradient findings; BMEL Ökobarometer. A high-vs-low SES
# ratio of organic consumption of ~2-3x is consistent with that literature.
# Default 2.5; document range 2.0-3.0.
bio_share_income_gradient_target: 2.3
#
# --- Effort (service quality) calibration — ADR-031 ---
# No clean dataset for retail service elasticity exists; X is a structural
# assumption (store-choice literature; German grocery is price-dominant).
# beta_effort is set so beta*e_max = X * basket_price_standard_eur, i.e.
# consumers would pay up to X% of the basket for a store at MAX service.
effort_importance_X: 0.10          # WTP(full effort)/basket; range 0.05-0.15
# kappa0 set so MEAN equilibrium effort = rho * e_max (interior -> a live
# lever the learners can move up and down).
effort_interior_target_rho: 0.40   # range 0.25-0.50
# Effort grid upper bound (normalization). 1.0 = effort as a [0,1] service
# intensity. MUST equal e_max in configs/agents/qlearning_effort.yaml.
effort_e_max: 1.0
# ---------------------------------------------------------------------------
#
# ───────────────────────────────────────────────────────────────────────────
# FOC-inversion calibration (ADR-032, optional alternative method)
# ───────────────────────────────────────────────────────────────────────────
# This block is read ONLY when scripts/calibrate_structural.py is invoked
# with --method foc_inversion. The legacy 2-parameter MoM method ignores it
# entirely.
#
# Mathematical role
#   The FOC-inversion strategy identifies (mu, q_S, q_B) in closed form using
#   the Nash-FOC identity p_τ − c_τ = μ / (1 − s_τ) and the aggregate logit
#   log-share-ratio identity, given two pieces of external demand-share data:
#   the s_B / s_D ratio (REQUIRED) and the s_S / s_D ratio (optional, defaults
#   to store-count proxy). See ADR-032 for the full derivation.
foc_inversion:
  # REQUIRED: bio-to-discount inside-market-share ratio.
  # Source options, in increasing order of empirical quality:
  #   (a) store-count proxy 91/196 = 0.464 (worst; just for smoke tests)
  #   (b) BKartA Beschluss B2-62/14 (Edeka/Kaiser's Berlin) local-market
  #       format shares — manually transcribe and divide.
  #   (c) Google Maps Popular Times aggregate visit volumes per chain,
  #       weighted by catchment population — see scripts/scrape_google_visits.
  #   (d) GfK / NielsenIQ household-panel format shares (academic licence).
  # Default 0.464 is the store-count proxy and IS UPWARD-BIASED in the wrong
  # direction (bio is more concentrated in high-density cells → true s_B/s_D
  # likely higher, in the 0.55–0.70 range). Replace as soon as a better
  # source is obtained.
  s_B_over_s_D: 0.167 # 0.464
  # Optional: standard-to-discount ratio. Defaults to store-count proxy
  # (207/196 = 1.0561) if null. Discount and standard are spatially
  # interleaved, so the count proxy is much less wrong here than for bio.
  s_S_over_s_D: 1.5 # null
  # When true, mu is the share-weighted average of the three FOC-implied
  # values; the spread (max − min) is reported as the over-identification
  # diagnostic. When false, mu_standard is used as the anchor.
  use_share_weighted_mu: true
  # When true, refine a_0 by 1D root-find after the closed-form q step so
  # that the model's outside share matches outside_share_target. When false,
  # a_0 is carried over from env_cfg.outside_option.
  refine_a0: true
  # When true, force chain-specific marginal costs (ADR-025
  # gross_margin_by_chain block) regardless of the global use_common_margin
  # flag. This addresses Assumption 5 from the calibration audit: a common
  # margin biases mu_implied_τ downward for high-margin tiers and upward for
  # low-margin tiers, polluting the FOC-spread diagnostic.
  force_chain_specific_costs: true
  # Override alpha_ratio if you want a different value than the global prior.
  # If null, falls back to env_cfg.alpha_ratio or 2.5.
  alpha_ratio: 2.3
