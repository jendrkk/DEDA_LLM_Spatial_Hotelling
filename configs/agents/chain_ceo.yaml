# agents/chain_ceo.yaml - LLM chain CEO agent parameters (v1: Google AI Studio Gemini)
# LiteLLM routes "gemini/<model>" to Google AI Studio when GEMINI_API_KEY is set
# (NOT Vertex). Record the exact model string in metadata for reproducibility:
# Gemini free-tier exposes alias-like names rather than dated snapshots (ADR-002 caveat).
model: "gemini/gemini-2.5-flash"   # set GEMINI_API_KEY in the environment
ceo_mode: "single"                 # "single" v1; "decomposed" (analyst sub-agents) reserved
temperature: 0                     # deterministic
max_tokens: 512
max_retries: 3
log_path: "results/llm_calls.jsonl"

# Euro-basket envelope guidance shown to the CEO and used by the safe-default
# fallback. min_delta_p ~ a couple of union-grid steps; min_delta_e for effort runs.
min_delta_p: 1.5
min_delta_e: 0.1
